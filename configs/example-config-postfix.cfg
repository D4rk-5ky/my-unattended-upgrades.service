# my-unattended-upgrades / mqtt-power-action.py example using local sendmail/Postfix.
# Version 0.0.2
# The script has one required application flag: -c/--config <path>.

[server]
# Friendly hostname used in MQTT payloads/topics/client IDs and mail subjects.
# Leave empty to use the OS hostname.
hostname = proxmox

[power]
# Valid values: shutdown, reboot, or none.
# shutdown = send configured notifications, wait delay_before_action, then power off.
# reboot   = send configured notifications, wait delay_before_action, then reboot.
# none     = send configured notifications only; never run systemctl and skip the delay.
#            Recommended when Home Assistant controls the next step in a sequence.
action = none

# Seconds to wait before shutdown/reboot. Ignored when action = none.
delay_before_action = 10

# true = never execute systemctl poweroff/reboot.
# IMPORTANT: this does NOT make apt-get update or unattended-upgrade itself a dry-run.
# MQTT and mail can still be sent while dry_run=true when their individual
# send_on_dry_run options are true.
dry_run = true

# false = return failure and do not perform the configured power action if the MQTT JSON
# status publish fails. true = continue toward the power action despite MQTT failure.
continue_on_mqtt_fail = false

# false = return failure and do not perform the configured power action if success mail
# fails. true = continue and publish MQTT success with warning=true.
continue_on_mail_fail = false

[mqtt]
# Enable the single MQTT output. There is no legacy event/message channel in 0.0.2+.
enabled = true

# While [power] dry_run=true:
# false = do not contact the MQTT broker; report the intentional skip locally as success.
# true  = really publish MQTT JSON status even though the power action is dry-run.
send_on_dry_run = false

# MQTT broker hostname/IP and port.
host = 10.0.0.10
port = 1883

# Optional broker login. Leave username empty when authentication is not required.
username =

# Direct broker password. Prefer password_env when possible.
password =

# Environment variable containing the broker password, for example MQTT_PASSWORD.
# Direct password above takes priority when both are set.
password_env =

# The ONE MQTT topic used by this app. Supports {hostname}, {safe_hostname}, {action}.
# Every publish is compact Syncerate-style JSON, always QoS 0 and retain=false.
topic = homeassistant/my-unattended-upgrades/{safe_hostname}/status

# Used for both "title" and "name" in the JSON status payload.
# Supports {hostname}, {safe_hostname}, {action}.
title = {hostname} unattended-upgrades

# auto generates mqtt-power-action-<safe hostname>.
# A custom value may use {hostname}, {safe_hostname}, {action}.
client_id = auto

# Seconds to wait for broker connection and publish confirmation.
connect_timeout = 10
publish_timeout = 10

[mail]
# Send success mail after apt-get update and unattended-upgrade complete successfully.
on_success = true

# Send failure mail for update/service failure, MQTT failure, mail failure, or power failure
# when the relevant failure path can still send mail.
on_failure = true

# While [power] dry_run=true:
# false = do not deliver email; report the intentional skip locally as success.
# true  = really deliver configured success/failure email during a dry-run test.
send_on_dry_run = false

# sendmail or smtp. This example uses local sendmail/Postfix.
backend = sendmail

# Recipient address. Required when on_success or on_failure is true.
to = receiver@example.com

# Sender address. Leave empty to use root@<hostname> with sendmail.
from = root@proxmox.local

# Subjects support {hostname}, {safe_hostname}, {action}.
success_subject = {hostname}: unattended-upgrades succeeded
failure_subject = {hostname}: unattended-upgrades failed

# Optional static text appended to mail bodies.
extra_body = Sent from local sendmail/Postfix.

[smtp]
# SMTP settings are ignored while [mail] backend = sendmail, but are included so this
# example documents every available option.
host = smtp.gmail.com
port = 587
username =
password =
password_env =
ssl = false
starttls = true
timeout = 20

[sendmail]
# Optional absolute sendmail path. Leave empty for automatic detection.
path =
