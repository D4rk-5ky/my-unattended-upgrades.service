# my-unattended-upgrades / mqtt-power-action.py example using direct SMTP.
# Version 0.0.2
# The script has one required application flag: -c/--config <path>.

[server]
# Friendly hostname used in MQTT payloads/topics/client IDs and mail subjects.
# Leave empty to use the OS hostname.
hostname = proxmox

[power]
# Valid values: shutdown, reboot, or none.
# none is recommended when Home Assistant controls sequencing after the JSON result.
action = none

# Seconds before shutdown/reboot. Ignored when action = none.
delay_before_action = 10

# true prevents the Python helper from actually shutting down/rebooting.
# It does NOT make apt-get update or unattended-upgrade itself a dry-run.
dry_run = true

# Notification failure policies before a real power action.
continue_on_mqtt_fail = false
continue_on_mail_fail = false

[mqtt]
# Enable the app's only MQTT channel: Syncerate-style JSON status.
enabled = true

# Set true if you want a real MQTT publish while [power] dry_run=true.
send_on_dry_run = false

# Broker connection and optional login.
host = 10.0.0.10
port = 1883
username =
password =
# Optional environment variable holding the password, for example MQTT_PASSWORD.
password_env =

# Single status topic. Supports {hostname}, {safe_hostname}, {action}.
# The app always uses QoS 0 and retain=false; these are intentionally not configurable.
topic = homeassistant/my-unattended-upgrades/{safe_hostname}/status

# Used for JSON "title" and "name".
title = {hostname} unattended-upgrades

# auto generates mqtt-power-action-<safe hostname>.
client_id = auto

# Broker connection/publish timeouts in seconds.
connect_timeout = 10
publish_timeout = 10

[mail]
# Send success and/or failure mail.
on_success = true
on_failure = true

# Set true if you want real email delivery while [power] dry_run=true.
send_on_dry_run = false

# This example uses direct SMTP.
backend = smtp

# Recipient and optional explicit sender.
to = receiver@example.com
from = yourgmail@gmail.com

# Subjects support {hostname}, {safe_hostname}, {action}.
success_subject = {hostname}: unattended-upgrades succeeded
failure_subject = {hostname}: unattended-upgrades failed

# Optional static text appended to the body.
extra_body = This message was sent by mqtt-power-action.py.

[smtp]
# SMTP server settings.
host = smtp.gmail.com
port = 587
username = yourgmail@gmail.com

# Use an app password/token where required. Prefer password_env to keep secrets out of
# this file. Direct password takes priority if both are set.
password =
password_env = GMAIL_APP_PASSWORD

# Port 465 commonly uses ssl=true/starttls=false.
# Port 587 commonly uses ssl=false/starttls=true.
ssl = false
starttls = true

# SMTP connect/login/send timeout in seconds.
timeout = 20

[sendmail]
# Ignored while backend=smtp; included to document every option.
path =
