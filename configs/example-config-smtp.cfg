# This config file is for using SMTP as the mail backend.
# It sends an MQTT message first, optionally sends mail through SMTP, then performs a power action.

[server]
# Friendly hostname used in MQTT messages, MQTT topic templates, client_id templates, and mail subjects.
# If this is empty or missing, the Python script falls back to the real OS hostname.
hostname = proxmox

[power]
# shutdown or reboot
# Power action to run after MQTT/mail has completed.
action = shutdown

# Seconds to wait after MQTT/mail before shutdown/reboot
# This gives Home Assistant, MQTT, and mail a little time before the machine powers off.
delay_before_action = 10

# Set true while testing
# true = test mode only. The script prints what it would do, but does not reboot/shutdown.
dry_run = true

# If MQTT fails, default is to abort shutdown/reboot
# false = abort the power action when MQTT publish fails.
continue_on_mqtt_fail = false

# If success mail fails, default is to abort shutdown/reboot
# false = abort the power action when the success mail cannot be sent.
continue_on_mail_fail = false

[mqtt]
# MQTT broker/server IP address or DNS name.
host = 10.0.0.10

# MQTT broker port. 1883 is the normal unencrypted MQTT port.
port = 1883

# MQTT username. Leave empty if your broker does not require login.
username =

# MQTT password written directly in this file.
# Leaving this empty is safer if you use password_env instead.
password =

# Name of an environment variable containing the MQTT password.
# Example: password_env = MQTT_PASSWORD
password_env =

# MQTT topic to publish to.
# {safe_hostname} is generated from [server] hostname and made safe for MQTT/client IDs.
topic = homeassistant/{safe_hostname}/power

# Example custom JSON message.
# {event} becomes server_shutdown or server_reboot.
# {hostname} becomes the hostname from [server].
#message = {"event":"{event}","host":"{hostname}","source":"unattended-upgrades"}

# auto makes the script generate JSON automatically:
# {"event":"server_shutdown","host":"proxmox"} or {"event":"server_reboot","host":"proxmox"}
message = auto

# auto makes the script generate a client ID like:
# mqtt-power-action-proxmox
client_id = auto

# MQTT Quality of Service.
# 0 = at most once, 1 = at least once, 2 = exactly once.
qos = 1

# false = do not retain the MQTT message on the broker.
# true = broker stores the last message on this topic for new subscribers.
retain = false

# Seconds to wait for MQTT connection before failing.
connect_timeout = 10

# Seconds to wait for MQTT publish confirmation before failing.
publish_timeout = 10


[mail]
# Enable/disable mails
# true = send an email when MQTT succeeds.
on_success = true

# true = send an email when MQTT or the power action fails.
on_failure = true

# sendmail or smtp
# This config uses SMTP.
backend = smtp

# Recipient email address.
to = receiver@example.com

# Sender email address.
# For Gmail SMTP this is normally the same as [smtp] username.
from = yourgmail@gmail.com

# Subject for success mail.
# {hostname} and {action} are replaced by the script.
success_subject = {hostname}: {action} MQTT sent successfully

# Subject for failure mail.
# {hostname} and {action} are replaced by the script.
failure_subject = {hostname}: {action} MQTT or power action failed

# Extra text appended to the email body.
extra_body = This message was sent by mqtt_power_action.py before power action.


[smtp]
# Gmail SMTP
# SMTP server address.
host = smtp.gmail.com

# SMTP submission port.
# 587 normally uses STARTTLS.
port = 587

# SMTP login username.
username = yourgmail@gmail.com

# Use a Gmail App Password here, not your normal Gmail password.
# Direct password:
# This is the password the script will use directly.
password = your-gmail-app-password

# Better alternative:
# password_env lets you keep the password out of the config file.
# The script reads the password from the named environment variable.
# password_env = GMAIL_APP_PASSWORD

# false = do not use SMTP_SSL from the start.
# For Gmail port 587 this should normally stay false.
ssl = false

# true = upgrade the SMTP connection to TLS using STARTTLS.
# For Gmail port 587 this should normally be true.
starttls = true

# Seconds to wait for SMTP connection/login/send operations.
timeout = 20


[sendmail]
# Only used when [mail] backend = sendmail
# Optional full path to sendmail if you switch backend to sendmail.
path =
