alias: My unattended-upgrades - MQTT JSON status with Pushover
description: >-
  Handle Syncerate-style success/failure JSON from my-unattended-upgrades and
  optionally continue a larger Home Assistant job sequence after success.
triggers:
  - trigger: mqtt
    id: unattended_upgrades_status
    topic: homeassistant/my-unattended-upgrades/proxmox/status
conditions: []
actions:
  - variables:
      report: >-
        {{ trigger.payload_json
           if trigger.payload_json is defined and trigger.payload_json is mapping
           else {} }}
      mqtt_status: "{{ report.status | default('unknown') | string | trim | lower }}"
      report_title: >-
        {{ report.title
           | default(report.name
           | default(report.job | default('my-unattended-upgrades'))) }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mqtt_status == 'success' }}"
        sequence:
          - action: notify.pushover
            continue_on_error: true
            data:
              title: "✅ Unattended-upgrades succeeded"
              message: >-
                {{ report_title }} finished successfully.
                Exit code: {{ report.exit_code | default('unknown') }}.
                {% if report.warning | default(false) | bool(false) %}
                Warning: one or more non-fatal notification errors were allowed.
                {% endif %}
              data:
                priority: 0
                sound: pushover

          # Replace this example with the command for the next step in your sequence.
          # - action: mqtt.publish
          #   data:
          #     topic: homeassistant/mqtt-listener/zotac-ri531
          #     payload: start_next_job
          #     qos: 0
          #     retain: false

      - conditions:
          - condition: template
            value_template: "{{ mqtt_status == 'failure' }}"
        sequence:
          - action: notify.pushover
            data:
              title: "❌ Unattended-upgrades failed"
              message: >-
                {{ report_title }} failed.
                Exit code: {{ report.exit_code | default('unknown') }}

                Error: {{ report.error | default('No error message') }}

                Last stderr/output: {{ report.stderr | default('No stderr captured') }}
              data:
                priority: 1
                sound: siren

    default:
      - action: notify.pushover
        data:
          title: "❔ Unattended-upgrades status unknown"
          message: >-
            Received an MQTT status that was neither success nor failure.
            Title: {{ report_title }}
            Topic: {{ trigger.topic }}
            Raw payload: {{ trigger.payload | default('No payload') }}
          data:
            priority: 0
            sound: pushover
mode: queued
max: 10
